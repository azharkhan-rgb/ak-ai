    <style>
        /* BASE STYLES */
        :root {
            --color-primary: #0A0F2C; /* Navy Blue - kept dark for neon contrast */
            --color-accent-1: #38BDF8; /* Primary Cyan */
            --color-accent-2: #A78BFA; /* Light Purple */
            --color-text: #E0E7FF;
            --color-text-faint: #9CA3AF;
            --duration: 0.35s;
            --smooth-ease: cubic-bezier(0.65, 0, 0.35, 1); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-primary);
            color: var(--color-text);
            overflow-x: hidden;
            position: relative; 
        }

        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        a {
            text-decoration: none;
            color: var(--color-accent-2);
            transition: color var(--duration) var(--smooth-ease);
        }

        .container {
            width: 90%;
            max-width: 1280px;
            margin: 0 auto;
        }
        
        /* Form Inputs */
        input[type="text"], input[type="email"], textarea, select {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--color-text);
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
            border-color: var(--color-accent-2);
            outline: none;
        }
        .contact-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text-faint);
        }
        
        /* AI Brief Output Styling */
        #brief-output {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 12px;
            background-color: rgba(167, 139, 250, 0.1); /* Use accent 2 */
            border: 1px solid var(--color-accent-2);
        }
        #brief-output h4 {
            color: var(--color-accent-2);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        /* --- NEW BACKGROUND UPGRADE: CYBER GRID MATRIX --- */
        #animated-blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10; 
            pointer-events: none;
            overflow: hidden;
        }

        #starfield-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }


        /* --- SCROLL PROGRESS BAR --- */
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--color-accent-1), var(--color-accent-2));
            z-index: 101;
            transition: width 0.1s linear;
        }

        /* --- NAVIGATION (Blurred Glass on Scroll) --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 1.5rem 0;
            transition: background var(--duration) var(--smooth-ease), backdrop-filter var(--duration) var(--smooth-ease), border-bottom var(--duration) var(--smooth-ease);
        }

        .navbar-scrolled {
            background-color: rgba(10, 15, 44, 0.9); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-text);
            display: flex;
            align-items: center;
        }

        .nav-logo img {
            height: 30px;
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--color-text-faint);
        }

        .nav-links a:hover {
            color: var(--color-accent-2);
        }

        /* --- BUTTONS (Standard and Magnetic) --- */
        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent-1), var(--color-accent-2));
            color: var(--color-primary);
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            transition: transform var(--duration) var(--smooth-ease), box-shadow var(--duration) var(--smooth-ease);
            border: none;
            cursor: pointer;
            text-align: center;
            will-change: transform, box-shadow;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.3); 
            transform: translateY(-2px);
        }
        
        /* Secondary Button Style */
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--color-accent-2);
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid var(--color-accent-1);
            cursor: pointer;
            transition: background-color var(--duration) var(--smooth-ease), border-color var(--duration) var(--smooth-ease);
            will-change: transform;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--color-accent-2);
        }

        /* Magnetic Button Styling refinement */
        .magnetic {
            will-change: transform;
            transition: transform 0.08s linear; 
        }

        /* --- CARD STYLES & 3D TILT EFFECT --- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: box-shadow var(--duration) var(--smooth-ease);
            z-index: 10;
            display: flex;
            flex-direction: column;
            
            perspective: 1000px;
        }
        
        /* The inner content div that gets transformed */
        .tilt-inner {
            transition: transform 0.1s linear, box-shadow var(--duration) var(--smooth-ease);
            transform-style: preserve-3d;
            height: 100%;
        }
        
        /* Neon Glow Effect on Card Hover */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, var(--color-accent-1) 0%, var(--color-accent-2) 50%, var(--color-accent-1) 100%);
            opacity: 0;
            filter: blur(40px);
            transition: opacity 0.5s var(--smooth-ease);
            z-index: -1;
        }

        /* Global lift and glow on card hover */
        .card:hover {
            box-shadow: 0 15px 45px rgba(56, 189, 248, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .card:hover .tilt-inner {
             box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
        }

        .card:hover::before {
            opacity: 0.2; 
            animation: rotateGlow 5s linear infinite;
        }

        @keyframes rotateGlow {
            to { transform: rotate(360deg); }
        }
        
        /* Portfolio Image Styling */
        .portfolio-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s linear; /* For tilt effect */
        }

        /* --- SCROLL ANIMATIONS --- */
        .anim-element {
            opacity: 0;
            transition: opacity 0.9s var(--smooth-ease), transform 0.9s var(--smooth-ease);
        }
        
        .anim-element.visible {
            opacity: 1;
            transform: none !important; 
        }

        .slide-up { transform: translateY(40px); }
        .slide-left { transform: translateX(-40px); }
        .slide-right { transform: translateX(40px); }

        /* --- BACK TO TOP BUTTON --- */
        #back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--color-accent-1);
            color: var(--color-primary);
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 99;
        }

        #back-to-top.show {
            opacity: 1;
            transform: scale(1);
        }

        #back-to-top:hover {
            background: var(--color-accent-2);
        }

        /* --- HERO SPECIFIC STYLES --- */
        .hero-section {
            padding: 12rem 0 6rem;
            display: flex;
            align-items: center;
            min-height: 100vh;
            position: relative;

        .hero-subtitle {

            }

            }

            }

                min-height: auto;
            }

                font-size: 2.5rem;
            }
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
            .lightbox-content {
                width: 95%;
            }
            .hero-title {
                font-size: 3rem;
            }
            .contact-flex {
                flex-direction: column;
            }
        }
    </style>

    <!-- --- JAVASCRIPT --- -->
    <script>
        const appContainer = document.getElementById('app-container');
        const navbar = document.getElementById('main-navbar');
        const progressBar = document.getElementById('scroll-progress');
        const backToTopBtn = document.getElementById('back-to-top');
        
        const pageTemplates = {
            'home': document.getElementById('home-page-template'),
            'services': document.getElementById('services-page-template'),
            'portfolio': document.getElementById('portfolio-page-template'),
            'about': document.getElementById('about-page-template'),
            'contact': document.getElementById('contact-page-template'),
        };
        const pageNames = ['home', 'services', 'portfolio', 'about', 'contact'];

        // --- GEMINI API Configuration ---
        const API_KEY = ""; 
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";

        // --- Utility function for Exponential Backoff (API calls) ---
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status !== 429 && response.ok) {
                        return response;
                    }
                    if (response.status === 429 && i < maxRetries - 1) {
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }
                    throw new Error(`API call failed with status: ${response.status}`);
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        /**
         * Calls the Gemini API to generate a structured project brief.
         */
        async function generateProjectBrief() {
            const ideaInput = document.getElementById('project-idea');
            const outputDiv = document.getElementById('brief-output');
            const loadingDiv = document.getElementById('brief-loading');
            const generateBtn = document.getElementById('generate-brief-btn');
            
            if (!ideaInput.value.trim()) {
                outputDiv.style.display = 'block';
                outputDiv.innerHTML = '<p style="color: var(--color-accent-2);">Please enter a project idea first.</p>';
                return;
            }

            outputDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span style="font-size: 1.5rem; line-height: 1;">⚙️</span> Generating...';

            const userQuery = `Generate a high-level project brief for this user idea: "${ideaInput.value.trim()}"`;
            
            const systemPrompt = `You are a world-class Digital Agency Strategist from AK STUDIO. Your task is to take a vague project idea and generate a structured, premium, and concise project brief. Keep the tone professional, aspirational, and focused on high-quality digital deliverables.`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
            
            // Define the JSON schema for the structured output
            const responseSchema = {
                type: "OBJECT",
                properties: {
                    projectName: { "type": "STRING", "description": "A creative, premium-sounding project name." },
                    slogan: { "type": "STRING", "description": "A concise, powerful marketing slogan for the product." },
                    coreFeatures: {
                        "type": "ARRAY",
                        "description": "A list of 3-4 essential features.",
                        "items": { "type": "STRING" }
                    },
                    techStackSuggestion: { "type": "STRING", "description": "A modern, high-performance technology suggestion (e.g., Next.js, headless CMS, serverless)."},
                    estimatedScope: { "type": "STRING", "description": "A high-level scope estimate (e.g., Small MVP, Medium Project, Large Enterprise Platform)." }
                },
                required: ["projectName", "slogan", "coreFeatures", "techStackSuggestion", "estimatedScope"]
            };

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema
                }
            };

            try {
                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                let briefJson;
                try {
                    const jsonString = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!jsonString) throw new Error("API response text is missing or empty.");
                    briefJson = JSON.parse(jsonString);
                } catch (e) {
                    console.error("Failed to parse Gemini JSON response:", e, result);
                    outputDiv.innerHTML = `<p style="color: var(--color-accent-2);">[AI Error] Could not structure the response. Please try a different idea.</p>`;
                    return;
                }

                let featuresHtml = briefJson.coreFeatures.map(f => `<li>${f}</li>`).join('');

                outputDiv.innerHTML = `
                    <h4 style="font-size: 1.5rem;">Project Brief: ${briefJson.projectName || 'Untitled Project'}</h4>
                    <p style="color: var(--color-accent-1); font-style: italic;">"${briefJson.slogan || 'No Slogan'}"</p>
                    
                    <h4>Key Features</h4>
                    <ul class="brief-feature-list">${featuresHtml}</ul>
                    
                    <h4>Suggested Technology</h4>
                    <p>${briefJson.techStackSuggestion || 'Modern stack required'}</p>
                    
                    <h4>Estimated Scope</h4>
                    <p style="font-weight: 600;">${briefJson.estimatedScope || 'TBD'}</p>
                    
                    <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-faint);">Ready to discuss this brief further? Fill out the contact form next to this!</p>
                `;
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error("Gemini API Error:", error);
                outputDiv.style.display = 'block';
                outputDiv.innerHTML = `<p style="color: var(--color-accent-2);">[System Error] Failed to reach the AI strategist. Please check the console for details.</p>`;
            } finally {
                loadingDiv.style.display = 'none';
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<span style="font-size: 1.5rem; line-height: 1;">✨</span> Generate Brief';
            }
        }

        // --- Framer Blur Fade Page Transitions & Routing ---
        function loadPage() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const pageKey = pageNames.includes(hash) ? hash : 'home';

            // 1. Start the 'fade out and blur' transition
            appContainer.classList.add('page-transition-out');
            appContainer.classList.remove('page-transition-in');
            appContainer.style.pointerEvents = 'none';

            setTimeout(() => {
                const template = pageTemplates[pageKey];
                if (template) {
                    // 2. Replace content
                    const clonedContent = template.content.cloneNode(true);
                    appContainer.innerHTML = '';
                    appContainer.appendChild(clonedContent);

                    // Re-initialize scripts for the new page
                    initPageScripts(pageKey);
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // 3. Start the 'fade in and de-blur' transition
                    appContainer.classList.remove('page-transition-out');
                    appContainer.classList.add('page-transition-in');
                    appContainer.style.pointerEvents = 'auto';

                } else {
                    appContainer.innerHTML = `<section class="container" style="padding: 10rem 0;"><h1 class="hero-title text-center">404 - Page Not Found</h1></section>`;
                    appContainer.classList.remove('page-transition-out');
                    appContainer.classList.add('page-transition-in');
                    appContainer.style.pointerEvents = 'auto';
                }
            }, 400); 
        }

        // --- Core Initialization for each page ---
        function initPageScripts(pageKey) {
            initScrollAnimations();
            initMagneticButtons();
            initCardTilt(); 
            initLightbox(); 
            
            if (pageKey === 'home') {
                initHeroTextAnimation();
            }
        }
        
        // --- 3D CARD TILT EFFECT ---
        function initCardTilt() {
            const tiltCards = document.querySelectorAll('.tilt-card');

            tiltCards.forEach(card => {
                const inner = card.querySelector('.tilt-inner');
                if (!inner) return;

                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    // Calculate position relative to the center (-1 to 1)
                    const halfWidth = rect.width / 2;
                    const halfHeight = rect.height / 2;
                    
                    // Reversed tilt: closer to center = less rotation
                    const rotateX = (-(y - halfHeight) / halfHeight) * 5; // Max 5 degrees
                    const rotateY = ((x - halfWidth) / halfWidth) * 5;     // Max 5 degrees

                    inner.style.transform = `scale(1.02) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(20px)`;
                });

                card.addEventListener('mouseleave', () => {
                    inner.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg) translateZ(0)';
                });
            });
        }

        // --- Smooth Scroll-Trigger Animations (IntersectionObserver) ---
        function initScrollAnimations() {
            const elements = document.querySelectorAll('.anim-element');
            elements.forEach(el => el.classList.remove('visible'));
            
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                rootMargin: '0px',
                threshold: 0.1
            });

            elements.forEach(el => observer.observe(el));
            
            // Also explicitly trigger the line divider animation
            const line = document.querySelector('.animated-line');
            if (line) {
                 const lineObserver = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        entries[0].target.style.strokeDashoffset = '0';
                        lineObserver.unobserve(entries[0].target);
                    }
                }, { threshold: 0.8 });
                lineObserver.observe(line);
            }
        }

        // --- Magnetic Button Hover ---
        function initMagneticButtons() {
            const magneticElements = document.querySelectorAll('.magnetic');
            
            magneticElements.forEach(el => {
                el.addEventListener('mousemove', (e) => {
                    const rect = el.getBoundingClientRect(); 
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const center = { x: rect.width / 2, y: rect.height / 2 };
                    
                    // Calculate movement relative to center (Max 8px movement)
                    const moveX = (x - center.x) * 0.3; 
                    const moveY = (y - center.y) * 0.3;
                    
                    el.style.transform = `translate(${moveX}px, ${moveY}px)`;
                });

                el.addEventListener('mouseleave', () => {
                    el.style.transform = `translate(0px, 0px)`;
                });
            });
        }

        // --- Navbar Scroll Effect & Scroll Progress/Back-to-Top Handler ---
        function handleScroll() {
            // 1. Navbar Scroll Effect
            if (window.scrollY > 50) {
                navbar.classList.add('navbar-scrolled');
            } else {
                navbar.classList.remove('navbar-scrolled');
            }

            // 2. Scroll Progress Bar
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
            progressBar.style.width = scrolled + "%";

            // 3. Back to Top Button visibility
            if (window.scrollY > 400) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        }

        // --- Letter-by-letter text reveal in hero ---
        const typingWords = ["Next-Gen Websites.", "Sleek SaaS Solutions.", "Powerful Branding."];
        let typingWordIndex = 0;
        let typingCharIndex = 0;
        let typingIsDeleting = false;
        let typingTimeout;

        function type() {
            const currentWord = typingWords[typingWordIndex];
            const typingTextEl = document.getElementById('typing-text');
            
            if (!typingTextEl) {
                clearTimeout(typingTimeout);
                return; 
            }

            if (typingIsDeleting) {
                typingTextEl.textContent = currentWord.substring(0, typingCharIndex - 1);
                typingCharIndex--;
            } else {
                typingTextEl.textContent = currentWord.substring(0, typingCharIndex + 1);
                typingCharIndex++;
            }

            let typeSpeed = 80;

            if (typingIsDeleting) {
                typeSpeed /= 2;
            }

            if (!typingIsDeleting && typingCharIndex === currentWord.length) {
                typeSpeed = 2000; 
                typingIsDeleting = true;
            } else if (typingIsDeleting && typingCharIndex === 0) {
                typingIsDeleting = false;
                typingWordIndex = (typingWordIndex + 1) % typingWords.length;
                typeSpeed = 500; 
            }

            typingTimeout = setTimeout(type, typeSpeed);
        }

        function initHeroTextAnimation() {
            clearTimeout(typingTimeout);
            typingCharIndex = 0;
            typingIsDeleting = false;
            typingWordIndex = 0;
            type();
        }
        
        // --- Lightbox Functions for Portfolio Page ---
        let lightbox;
        function openLightbox(src, caption) {
            lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-image').src = src;
            document.getElementById('lightbox-caption').textContent = caption;
            lightbox.style.display = 'block'; 
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
        }
        
        function initLightbox() {
            lightbox = document.getElementById('lightbox');
            const closeBtn = document.querySelector('.lightbox-close');
            if(closeBtn) closeBtn.onclick = closeLightbox;
            
            document.querySelectorAll('.portfolio-item img').forEach(img => {
                img.onclick = function(e) {
                    e.preventDefault(); 
                    openLightbox(this.getAttribute('data-image'), this.getAttribute('data-caption'));
                };
            });
            
            if(lightbox) {
                lightbox.onclick = (e) => {
                    if(e.target.id === 'lightbox') closeLightbox();
                };
            }
        }
        
        // --- Contact Form Success Message ---
        function showContactMessage() {
            const msgEl = document.getElementById('contact-message');
            if(msgEl) msgEl.style.display = 'block';
            
            document.querySelector('.contact-form').reset();
            
            setTimeout(() => {
                if(msgEl) msgEl.style.display = 'none';
            }, 5000);
        }
        
        // --- CYBER GRID MATRIX Animation Logic ---
        let gridCanvas;
        let ctx;
        let width, height;
        let centerX, centerY;
        let animationFrameId;
        const GRID_SIZE = 40; // Spacing for grid points
        const Z_DEPTH = 120; // Number of vertical lines to draw
        let animationTime = 0;

        function resizeCanvas() {
            if (!gridCanvas) return;
            width = window.innerWidth;
            height = window.innerHeight;
            gridCanvas.width = width;
            gridCanvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            // The canvas context needs to be re-acquired on resize in some environments, but we'll stick to a simple assignment for now.
        }
        
        function animateGrid() {
            if (!ctx) return;
            
            // Clear the canvas with a transparent layer for subtle trailing effect
            ctx.fillStyle = 'rgba(10, 15, 44, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            animationTime += 0.05; // Time variable for movement and pulsing

            // 1. Draw Horizontal Lines (Receding Perspective)
            for (let z = 0; z < Z_DEPTH; z++) {
                // zPrime is the animated position of the line in 3D space
                let zPrime = (z + animationTime) % Z_DEPTH; 
                
                // Perspective scale factor
                let scale = 1 / (1 + zPrime / 30); 
                
                // Opacity fades as the lines approach the "horizon"
                ctx.globalAlpha = scale * 0.8; 

                // Calculate screen Y position (from the bottom up)
                let screenY = centerY + (height / 2) * scale;
                
                // Calculate line width (wider near the bottom)
                let lineWidth = width * scale * 1.5; 

                // Draw the line
                ctx.strokeStyle = `var(--color-accent-1)`;
                ctx.lineWidth = 1 + scale * 1.5;
                ctx.beginPath();
                ctx.moveTo(centerX - lineWidth / 2, screenY);
                ctx.lineTo(centerX + lineWidth / 2, screenY);
                ctx.stroke();
            }

            // 2. Draw Vertical Lines (Static for convergence)
            for (let x = -GRID_SIZE; x <= GRID_SIZE; x++) {
                ctx.globalAlpha = 0.3; // Constant low opacity for structural lines
                ctx.strokeStyle = 'var(--color-accent-2)';
                ctx.lineWidth = 1;

                // Map grid lines from bottom center (0, height) to top center (centerX, centerY)
                ctx.beginPath();
                ctx.moveTo(centerX, centerY); 
                
                // Calculate x position at the bottom edge (z=0)
                let bottomX = centerX + x * (width / GRID_SIZE) * 0.5; 
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }
            
            // 3. Draw Pulsing Points on the Grid
            const pulseRate = 0.05;
            for (let x = -GRID_SIZE; x <= GRID_SIZE; x += 4) {
                for (let z = 10; z < Z_DEPTH; z += 10) {
                    let zPrime = (z + animationTime) % Z_DEPTH;
                    let scale = 1 / (1 + zPrime / 30);
                    
                    if (scale > 0.05) { // Only draw visible points
                        let pointX = centerX + (x * (width / GRID_SIZE) * 0.5) * scale;
                        let pointY = centerY + (height / 2) * scale;
                        
                        // Pulsing opacity and size based on time and position
                        let pulse = Math.sin(animationTime * pulseRate + x * 0.1 + z * 0.05) * 0.5 + 0.5;
                        
                        ctx.globalAlpha = pulse * 0.5 + 0.5;
                        ctx.fillStyle = `rgba(56, 189, 248, ${ctx.globalAlpha})`; // Accent 1
                        
                        let size = 2 + scale * 4 * pulse;
                        
                        ctx.beginPath();
                        ctx.arc(pointX, pointY, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }


            animationFrameId = requestAnimationFrame(animateGrid);
        }

        function initGrid() {
            gridCanvas = document.getElementById('starfield-canvas');
            if (!gridCanvas) return;
            
            ctx = gridCanvas.getContext('2d');
            
            resizeCanvas();

            // Start animation loop
            if (!animationFrameId) {
                animateGrid();
            }
        }
        
        function stopGrid() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }


        // --- Global Event Listeners ---
        window.addEventListener('hashchange', loadPage);
        window.addEventListener('scroll', handleScroll); 
        window.addEventListener('resize', resizeCanvas);


        // --- Initial Load ---
        window.onload = () => {
            initGrid(); // Initialize the dynamic background
            handleScroll(); 
            if (!window.location.hash || !pageNames.includes(window.location.hash.replace('#', ''))) {
                window.location.hash = '#home';
            }
            loadPage(); 
        };
    </script>
</body>
